$kind: http-request
method: GET
url: '{{base_url}}/task-management/tasks/{{subtask_id}}/labels'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Two labels', () => pm.expect(pm.response.json().map((l) => l.name)).to.eql(['Bug', 'UI']));
