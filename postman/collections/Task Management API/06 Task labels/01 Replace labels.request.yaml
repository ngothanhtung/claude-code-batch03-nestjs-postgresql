$kind: http-request
method: PUT
url: '{{base_url}}/task-management/tasks/{{subtask_id}}/labels'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "labelIds": [{{label_ui_id}}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Only UI', () => pm.expect(pm.response.json().map((l) => l.name)).to.eql(['UI']));
