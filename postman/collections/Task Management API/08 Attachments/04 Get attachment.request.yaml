$kind: http-request
method: GET
url: '{{base_url}}/task-management/tasks/{{task_id}}/attachments/{{attachment_id}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('fileSize is a number', () => pm.expect(pm.response.json().fileSize).to.eql(248000));
