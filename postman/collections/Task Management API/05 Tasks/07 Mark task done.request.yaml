$kind: http-request
method: PATCH
url: '{{base_url}}/task-management/tasks/{{task_id}}'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "done"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('completedAt is set', () => pm.expect(pm.response.json().completedAt).to.be.a('string'));
