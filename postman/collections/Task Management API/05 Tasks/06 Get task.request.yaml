$kind: http-request
method: GET
url: '{{base_url}}/task-management/tasks/{{task_id}}'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Includes labels', () => pm.expect(pm.response.json().labels).to.have.lengthOf(2));
