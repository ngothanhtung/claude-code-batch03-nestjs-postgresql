$kind: http-request
method: POST
url: '{{base_url}}/task-management/tasks'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "projectId": {{project_id}},
      "title": "x",
      "createdBy": {{owner_id}},
      "assigneeId": {{outsider_id}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Message mentions "is not a member of project"', () => {
        pm.expect(JSON.stringify(pm.response.json().message)).to.include('is not a member of project');
      });
