$kind: http-request
method: PATCH
url: '{{base_url}}/task-management/tasks/{{task_id}}'
order: 14000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "assigneeId": null
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('assigneeId is null', () => pm.expect(pm.response.json().assigneeId).to.eql(null));
