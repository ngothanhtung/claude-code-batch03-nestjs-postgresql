$kind: http-request
method: GET
url: '{{base_url}}/task-management/tasks?parentId={{task_id}}'
order: 12000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('One sub-task', () => pm.expect(pm.response.json().data.map((t) => t.id)).to.eql([Number(pm.collectionVariables.get('subtask_id'))]));
