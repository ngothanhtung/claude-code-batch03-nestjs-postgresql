$kind: http-request
method: PATCH
url: '{{base_url}}/task-management/tasks/{{task_id}}'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "parentId": {{subtask_id}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Message mentions "cycle"', () => {
        pm.expect(JSON.stringify(pm.response.json().message)).to.include('cycle');
      });
