$kind: http-request
method: POST
url: '{{base_url}}/task-management/tasks'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "projectId": {{project_id}},
      "title": "Design home page",
      "createdBy": {{owner_id}},
      "assigneeId": {{member_id}},
      "priority": "high",
      "dueDate": "2026-11-20",
      "labelIds": [{{label_ui_id}}, {{label_bug_id}}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 201 Created', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Defaults: status todo, position 0, not completed', () => {
        pm.expect(body.status).to.eql('todo');
        pm.expect(body.position).to.eql(0);
        pm.expect(body.completedAt).to.eql(null);
      });
      pm.test('Labels attached, sorted by name', () => {
        pm.expect(body.labels.map((l) => l.name)).to.eql(['Bug', 'UI']);
      });
      pm.collectionVariables.set('task_id', pm.response.json().id);
