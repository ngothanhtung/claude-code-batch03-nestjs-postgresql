$kind: http-request
method: POST
url: '{{base_url}}/task-management/projects'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "No owner",
      "ownerId": 999999
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Message mentions "does not exist"', () => {
        pm.expect(JSON.stringify(pm.response.json().message)).to.include('does not exist');
      });
