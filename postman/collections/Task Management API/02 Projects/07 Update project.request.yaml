$kind: http-request
method: PATCH
url: '{{base_url}}/task-management/projects/{{project_id}}'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "description": "Company website"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Description updated', () => pm.expect(pm.response.json().description).to.eql('Company website'));
