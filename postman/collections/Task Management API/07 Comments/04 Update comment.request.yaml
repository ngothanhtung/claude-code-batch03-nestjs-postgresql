$kind: http-request
method: PATCH
url: '{{base_url}}/task-management/tasks/{{task_id}}/comments/{{comment_id}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "content": "Header and footer are done"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Content updated', () => pm.expect(pm.response.json().content).to.eql('Header and footer are done'));
