$kind: http-request
method: GET
url: '{{base_url}}/task-management/tasks/{{task_id}}/comments/{{comment_id}}'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200 OK', () => pm.response.to.have.status(200));
      pm.test('Author is null', () => {
        pm.expect(pm.response.json().userId).to.eql(null);
        pm.expect(pm.response.json().user).to.eql(null);
      });
