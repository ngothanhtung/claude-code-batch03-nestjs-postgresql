$kind: http-request
method: DELETE
url: '{{base_url}}/task-management/users/{{creator_id}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 409 Conflict', () => pm.response.to.have.status(409));
      pm.test('Message mentions "created tasks"', () => {
        pm.expect(JSON.stringify(pm.response.json().message)).to.include('created tasks');
      });
