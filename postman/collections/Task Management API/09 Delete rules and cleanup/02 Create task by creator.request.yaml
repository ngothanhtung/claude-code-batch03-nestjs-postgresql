$kind: http-request
method: POST
url: '{{base_url}}/task-management/tasks'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "projectId": {{project_id}},
      "title": "Created by creator",
      "createdBy": {{creator_id}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('creator_task_id', pm.response.json().id);
