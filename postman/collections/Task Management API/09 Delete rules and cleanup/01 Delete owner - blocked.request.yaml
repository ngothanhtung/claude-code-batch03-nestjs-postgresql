$kind: http-request
method: DELETE
url: '{{base_url}}/task-management/users/{{owner_id}}'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 409 Conflict', () => pm.response.to.have.status(409));
      pm.test('Message mentions "owns projects"', () => {
        pm.expect(JSON.stringify(pm.response.json().message)).to.include('owns projects');
      });
