$kind: http-request
method: POST
url: '{{base_url}}/task-management/projects/{{project_id}}/labels'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Bad",
      "color": "red"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('Message mentions "hex color"', () => {
        pm.expect(JSON.stringify(pm.response.json().message)).to.include('hex color');
      });
