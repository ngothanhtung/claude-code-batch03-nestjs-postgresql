$kind: http-request
method: POST
url: '{{base_url}}/task-management/projects/{{project_id}}/labels'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Bug",
      "color": "#DC2626"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('label_bug_id', pm.response.json().id);
