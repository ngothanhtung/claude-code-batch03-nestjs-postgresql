$kind: http-request
method: POST
url: '{{base_url}}/task-management/users'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "TM Member",
      "email": "tm.member.{{run_id}}@example.com",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('member_id', pm.response.json().id);
