$kind: http-request
method: DELETE
url: '{{base_url}}/task-management/users/:id'
order: 18000
pathVariables:
  - key: id
    value: '{{user_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 404 Not Found (already deleted)', () => pm.response.to.have.status(404));
