$kind: http-request
method: PATCH
url: '{{base_url}}/task-management/users/:id'
order: 15000
pathVariables:
  - key: id
    value: '999999999'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Nobody"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 404 Not Found', () => pm.response.to.have.status(404));
